spring.application.name=IntelliHealth
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database Configuration (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/intellihealth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Security Configuration
spring.security.jwt.secret=${JWT_SECRET:__GENERATE_RANDOM_256_BIT_SECRET__}
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000},http://localhost:4200,http://127.0.0.1:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Error Handling
server.error.include-message=always
